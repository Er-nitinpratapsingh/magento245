<div class="minicart-items-wrapper overflowed" data-bind="css: {overflowed: getCartLineItemsCount() > 3}">
    <ol id="mini-cart" class="minicart-items" data-bind="foreach: { data: getCartItems(), as: 'item' }">
        <li class="item product product-item" data-bind="attr: {'data-role': 'product-item'}">
            <div class="product">
                <!-- ko if: product_has_url -->
                <a data-bind="attr: {href: product_url, title: product_name}" tabindex="-1" class="product-item-photo">
                    <!-- ko foreach: $parent.getRegion('itemImage') -->
                        <!-- ko template: {name: getTemplate(), data: item} --><!-- /ko -->
                    <!-- /ko -->
                </a>
                <!-- /ko -->
                <!-- ko ifnot: product_has_url -->
                <span class="product-item-photo">
                    <!-- ko foreach: $parent.getRegion('itemImage') -->
                        <!-- ko template: {name: getTemplate(), data: item} --><!-- /ko -->
                    <!-- /ko -->
                </span>
                <!-- /ko -->

                <div class="product-item-details">
                    <!-- ko if: product_has_url -->
                    <a data-bind="attr: {href: product_url}, html: product_name" class="product-item-name"></a>
                    <!-- /ko -->
                    <!-- ko ifnot: product_has_url -->
                    <strong class="product-item-name" data-bind="html: product_name"></strong>
                    <!-- /ko -->

                    <!-- ko if: options.length -->
                    <div class="product options" data-bind="foreach: options">
                        <span class="label" data-bind="text: label"></span>
                        <span class="values" data-bind="html: value"></span>
                    </div>
                    <!-- /ko -->
                    <div class="product-item-pricing">
                        <!-- ko if: canApplyMsrp -->
                        <div class="details-map">
                            <span class="label" data-bind="i18n: 'Price'"></span>
                            <span class="value" data-bind="i18n: 'See price before order confirmation.'"></span>
                        </div>
                        <!-- /ko -->
                        <!-- ko ifnot: canApplyMsrp -->
                        <!-- ko foreach: $parent.getRegion('priceSidebar') -->
                            <!-- ko template: {name: getTemplate(), data: item, as: 'item'} --><!-- /ko -->
                        <!-- /ko -->
                        <!-- /ko -->
                    </div>

                    <div data-bind="html: message"></div>

                    <div class="product actions">
                        <!-- ko if: is_visible_in_site_visibility -->
                        <div class="primary">
                            <a data-bind="attr: {href: configure_url, title: $t('Edit item')}" class="action edit">
                                <span data-bind="i18n: 'Edit'"></span>
                            </a>
                        </div>
                        <!-- /ko -->
                        <div class="secondary">
                            <a href="#" data-bind="attr: {'data-cart-item': item_id, title: $t('Remove item')}"
                               class="action delete">
                                <span data-bind="i18n: 'Remove'"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </li>
    </ol>
</div>

<div class="subtotal">
    <span class="label">
        <span><!-- ko i18n: 'Cart Subtotal'--><!-- /ko --></span>
    </span>

    <!--ko if: getCartParam('subtotal_incl_tax') && getCartParam('subtotal_excl_tax') -->
        <div class="subtotal-info">
            <span class="price-including-tax">
                <span class="label"><!-- ko i18n: 'Incl. Tax'--><!-- /ko --></span>
                <span class="price" data-bind="html: getCartParam('subtotal_incl_tax')"></span>
            </span>
            <span class="price-excluding-tax">
                <span class="label"><!-- ko i18n: 'Excl. Tax'--><!-- /ko --></span>
                <span class="price" data-bind="html: getCartParam('subtotal_excl_tax')"></span>
            </span>
        </div>
    <!--/ko-->
    <!--ko if: !getCartParam('subtotal_incl_tax') || !getCartParam('subtotal_excl_tax') -->
        <span class="price-container">
            <span class="price-wrapper">
                <span class="price" data-bind="html: getCartParam('subtotal')"></span>
            </span>
        </span>
    <!--/ko-->
</div>

<!-- CUSTOM TOTAL ADDED HERE -->
<!-- ko if: getCartParam('customer_total') -->
<div class="subtotal customer-total-line">
    <span class="label">
        <span><!-- ko i18n: 'Customer Total'--><!-- /ko --></span>
    </span>
    <span class="price-container">
        <span class="price-wrapper">
            <span class="price" data-bind="html: getCartParam('customer_total')"></span>
        </span>
    </span>
</div>
<!-- /ko -->
<!-- END CUSTOM TOTAL -->

<!-- ko foreach: getRegion('extra_info') -->
    <!-- ko template: getTemplate() --><!-- /ko -->
<!--/ko-->
<div id="minicart-widgets" class="minicart-widgets"></div>
