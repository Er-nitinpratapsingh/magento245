<div class="custom-total" data-bind="visible: getCustomTotal()">
    <tr class="totals">
        <th class="mark" scope="row">
            <span class="label" data-bind="text: getCustomTotal().label"></span>
        </th>
        <td class="amount">
            <span class="price" data-bind="text: getCustomTotal().formatted_value"></span>
        </td>
    </tr>
</div>
